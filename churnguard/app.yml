version: 2

name: CHURNGUARD
database: SFQUICKSTART_CHURNGUARD
schema: PUBLIC
query_warehouse: SFQUICKSTART_CHURNGUARD_WH

label: ChurnGuard
description: Customer churn risk dashboard for retention teams
icon: public/icon.svg

# Usage marker (see AGENTS.md): anonymous DevRel origin label. Delete to opt out.
environment_variables:
  - name: APP_ORIGIN
    value: "devrel:churnguard:v1"

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - semantic

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
